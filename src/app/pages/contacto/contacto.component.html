<section class="section">
  <div class="container">
    <div class="section-head">
      <h2>Contáctanos</h2>
      <p>¿Tienes una historia, sugerencia o comentario? Escríbenos.</p>
    </div>

    <form class="form-card" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
      <div class="alert" [class.show]="confirmado()" role="status">
        ¡Gracias! Tu mensaje ha sido enviado correctamente.
      </div>

      <div class="field" [class.invalid]="invalido('nombre')">
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" formControlName="nombre" placeholder="Tu nombre" />
        <span class="error">Escribe tu nombre completo (mínimo 3 caracteres).</span>
      </div>

      <div class="field" [class.invalid]="invalido('email')">
        <label for="email">Correo electrónico</label>
        <input type="text" id="email" formControlName="email" placeholder="tucorreo@ejemplo.com" />
        <span class="error">Escribe un correo electrónico válido.</span>
      </div>

      <div class="field" [class.invalid]="invalido('mensaje')">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" formControlName="mensaje" placeholder="Escribe tu mensaje"></textarea>
        <span class="error">El mensaje debe tener al menos 10 caracteres.</span>
      </div>

      <button type="submit" class="btn btn-primary">Enviar mensaje</button>
    </form>
  </div>
</section>
