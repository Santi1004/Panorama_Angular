<article class="card" [attr.data-id]="noticia.id">
  <div class="card-media">
    <img [src]="noticia.imagen" [alt]="noticia.titulo" loading="lazy" />
  </div>
  <div class="card-body">
    <span class="card-cat">{{ nombreCategoria }}</span>
    <h3>{{ noticia.titulo }}</h3>
    <p>{{ noticia.descripcionBreve }}</p>
    <div class="card-footer">
      <span class="card-date">{{ noticia.fecha | date: formatoFecha }}</span>
      <a class="btn btn-small" [routerLink]="['/noticia', noticia.id]">Ver más</a>
      @if (permitirEliminar) {
        <button
          type="button"
          class="btn btn-small btn-danger btn-eliminar"
          (click)="eliminar.emit(noticia.id)"
        >
          Eliminar
        </button>
      }
    </div>
  </div>
</article>
